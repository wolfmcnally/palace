  contract: A store opted in as published publishes its chunk vectors to an S3 Vectors index incrementally by chunk key. The personal store, a vault-overlapping watch root, a missing or incomplete opt-in, oversize text metadata, and an index of another dimension or distance are refused before any write. A first publish creates the bucket and index and puts every vector byte-exact; one changed file puts only its new keys and then deletes its vanished ones; an unchanged store writes nothing; a receipt that does not vouch (none, interrupted, another identity) republishes every key and a damaged key list costs one listing. Stale keys on later listing pages and a deletion that fails part-way converge on the next publish; a receipt write failure is an error carrying usage. Every request attempt is audited without corpus text and counted, retries included, and through the real SDK client each transport attempt is exactly one audit record; the command prints one JSON object on success and failure.
