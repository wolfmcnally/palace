  contract: Query embeddings use the literal query bytes, one call per distinct input per recorded identity across stores, with expansion reused. Prepared multi-store search makes every expansion and embedding call in preparation and none in execution, which returns the single call's result. A query whose BM25 leg refuses, or whose pool exceeds sqlite-vec's k limit (text matched to the real extension), is never embedded, and a remote-corpus boundary failure wins over that bound. Preparation closes every snapshot it opened and every provider it constructed, on success and on refusal, and never closes an injected one. Execution searches current rows, so a file indexed or removed after preparation, or a newly indexed watch root, is found or gone. It refuses an altered, hand-made or foreign prepared value before admission, any unprepared embedding or expansion input, and a changed recorded identity or embedder selector.
