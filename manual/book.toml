[book]
title = "Palace Manual"
authors = ["Wolf McNally"]
description = "Give agents and applications relevant, traceable context from local files with Palace."
language = "en"
src = "src"

[build]
build-dir = "../.kickoff/manual"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.3" # do not edit: managed by `mdbook-admonish install`
on_failure = "bail"

[output.html]
site-url = "/"
additional-css = ["mdbook-admonish.css"]

[output.html.playground]
runnable = false

[output.html.search]
enable = true

[output.html.print]
enable = true
